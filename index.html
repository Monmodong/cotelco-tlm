<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COTELCO: Transformer Load Management</title>
<meta name="theme-color" content="#2b2b2b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="COTELCO TLM">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{--bg:#1e1e1e;--card:#2b2b2b;--ink:#f1f1f1;--mute:#a3a3a3;--line:#414141;--acc:#1e96f0;--acc-ink:#fff;--warn:#f5a033;--ok:#47b872;--off:#e5484d;--hdr:#2b2b2b;--hdr-ink:#f1f1f1;--ease:cubic-bezier(.22,.78,.28,1);color-scheme:dark}
:root[data-theme=light]{--bg:#eef0ec;--card:#fbfbf8;--ink:#1c2b30;--mute:#5d6b70;--line:#c9cfc9;--acc:#0e6a6a;--acc-ink:#fff;--warn:#b4541a;--ok:#2f7d3a;--off:#c9302c;--hdr:#1c2b30;--hdr-ink:#eef0ec;color-scheme:light}
#thm{padding:4px 12px;border-radius:99px;border:1px solid var(--hdr-ink);background:none;color:var(--hdr-ink);font:inherit;font-size:.8rem;cursor:pointer}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);transition:background-color .3s var(--ease),color .3s var(--ease)}
header{position:sticky;top:0;z-index:5;background:var(--hdr);color:var(--hdr-ink);padding:10px 14px;display:flex;align-items:center;gap:10px;transition:background-color .3s var(--ease),color .3s var(--ease)}
header h1{font-size:clamp(.9rem,3.4vw,1.05rem);line-height:1.25;margin:0;flex:1;letter-spacing:.2px}
#net{width:10px;height:10px;border-radius:50%;flex:none;background:var(--off);box-shadow:0 0 0 3px rgba(229,72,77,.16);transition:background-color .35s var(--ease),box-shadow .35s var(--ease)}
#net.on{background:var(--ok);box-shadow:0 0 0 3px rgba(71,184,114,.16);animation:netPulse 2.6s ease-out infinite}
@keyframes netPulse{0%{box-shadow:0 0 0 0 rgba(71,184,114,.45)}70%{box-shadow:0 0 0 7px rgba(71,184,114,0)}100%{box-shadow:0 0 0 0 rgba(71,184,114,0)}}
nav{display:flex;background:var(--card);border-bottom:2px solid var(--line);transition:background-color .3s var(--ease),border-color .3s var(--ease)}
nav button{flex:1;padding:12px;border:0;background:none;color:var(--mute);font:inherit;font-weight:600;border-bottom:4px solid transparent;margin-bottom:-2px;cursor:pointer;transition:color .2s var(--ease),border-color .25s var(--ease),background-color .2s var(--ease)}
nav button:hover{color:var(--ink)}
nav button[aria-selected=true]{color:var(--ink);border-color:var(--acc)}
main{max-width:720px;margin:0 auto;padding:14px}
fieldset{border:0;border-left:5px solid var(--acc);background:var(--card);margin:0 0 14px;padding:12px 14px 14px;border-radius:0 8px 8px 0;transition:background-color .3s var(--ease),border-color .3s var(--ease)}
legend{font-weight:700;font-size:1.05rem;padding:0 6px;margin-left:-6px;background:var(--card);transition:background-color .3s var(--ease),color .3s var(--ease)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:3px}
input[type=text],input[type=number],select,textarea{width:100%;padding:11px;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:6px;transition:border-color .2s var(--ease),box-shadow .2s var(--ease),background-color .2s var(--ease)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(30,150,240,.14)}
textarea{min-height:60px;resize:vertical}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{margin:0;flex:1;min-width:80px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:block;text-align:center;padding:11px 6px;border:1.5px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font-size:.95rem;transition:background-color .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease),transform .12s var(--ease)}
.seg span:active{transform:scale(.97)}
.seg input:checked+span{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
.seg input:focus-visible+span{outline:3px solid var(--acc);outline-offset:1px}
.btn{padding:12px 16px;border-radius:6px;border:1.5px solid var(--acc);background:none;color:var(--acc);font:inherit;font-weight:700;cursor:pointer;transition:transform .15s var(--ease),background-color .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease),filter .2s var(--ease)}
.btn.p{background:var(--acc);color:var(--acc-ink)}
.btn.d{border-color:var(--warn);color:var(--warn)}
.btn:hover,#thm:hover,.mb button:hover{filter:brightness(1.1)}
.btn:active,#thm:active,.mb button:active{transform:scale(.95)}
.btn.p:not(:disabled):hover{box-shadow:0 4px 14px rgba(30,150,240,.3)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
#gps{font-size:.85rem;color:var(--mute);margin-top:6px}
.unit{display:flex;align-items:center;gap:6px}.unit b{color:var(--mute);font-weight:400}
.rec{background:var(--card);border-left:5px solid var(--line);border-radius:0 8px 8px 0;padding:10px 12px;margin-bottom:10px;animation:rise .32s var(--ease) both;transition:background-color .3s var(--ease),border-color .3s var(--ease)}
.rec.tx{border-color:var(--acc)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rec h3{margin:0 0 2px;font-size:1.05rem}
.rec p{margin:2px 0;font-size:.9rem;color:var(--mute)}
.rec .row{margin-top:8px}.rec .btn{padding:7px;font-size:.85rem}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,10px) scale(.98);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;transition:opacity .22s var(--ease),transform .22s var(--ease);pointer-events:none;z-index:9}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
#map{position:relative;height:calc(100vh - 170px);min-height:340px;background:var(--card);border:1.5px solid var(--line);border-radius:8px;overflow:hidden;transition:height .34s var(--ease),background-color .3s var(--ease),border-color .3s var(--ease)}
body.proj-hide #map{height:calc(100vh - 118px)}
#cv{width:100%;height:100%;display:block;touch-action:none}
.mb{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.mb button{width:46px;height:46px;border-radius:8px;border:1.5px solid var(--acc);background:var(--card);color:var(--acc);font:inherit;font-weight:700;cursor:pointer;transition:transform .15s var(--ease),background-color .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease),filter .2s var(--ease),opacity .2s var(--ease)}
.mb button:disabled{opacity:.35;cursor:not-allowed;filter:none;transform:none}
#gstat{position:absolute;left:6px;right:62px;top:62px;background:var(--card);border:1.5px solid var(--warn);border-radius:8px;padding:6px 10px;font-size:.82rem;animation:popIn .22s var(--ease);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#gstat span{flex:1;min-width:140px}
#gstat .btn{padding:6px 10px;font-size:.78rem;line-height:1.2}
#mnote{position:absolute;left:6px;top:6px;font-size:.72rem;background:var(--card);color:var(--mute);padding:2px 6px;border-radius:4px}
#pop{position:absolute;left:8px;right:64px;bottom:8px;background:var(--card);border:1.5px solid var(--acc);border-radius:8px;padding:10px;font-size:.9rem;animation:popIn .24s var(--ease)}
@keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
#pop .btn{padding:7px}
#sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-bottom:env(safe-area-inset-bottom);animation:sheetIn .3s var(--ease)}
@keyframes sheetIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
#sheet .bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;background:var(--hdr);color:var(--hdr-ink);padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
#sheet .bar b{flex:1}#sheet .bar .btn{border-color:var(--hdr-ink);color:var(--hdr-ink);padding:7px 12px}
.calc{background:var(--bg);border:1.5px dashed var(--line);border-radius:6px;padding:8px 10px;font-size:.92rem}.calc:empty{display:none}
.bad{color:var(--warn);font-weight:700}
#pop p{margin:3px 0}
#baseSel{position:absolute;left:6px;top:32px;width:auto;max-width:60%;padding:6px 8px;font-size:.85rem}
#projbar{display:flex;align-items:center;gap:10px;background:var(--card);padding:8px 14px;border-bottom:2px solid var(--line);overflow:hidden;max-height:300px;transition:max-height .34s var(--ease),opacity .24s var(--ease),padding .34s var(--ease),background-color .3s var(--ease),border-bottom-width .34s var(--ease),border-color .3s var(--ease)}
#projbar.hide{max-height:0!important;opacity:0;padding-top:0;padding-bottom:0;border-bottom-width:0;pointer-events:none}
#projbar label{margin:0;white-space:nowrap;font-weight:700;color:var(--ink)}#projbar input{padding:8px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:8px}
#projbar{flex-wrap:wrap}#projbar select{flex:1;min-width:120px;padding:8px}#projbar .btn{padding:7px 10px;font-size:.85rem;flex:none}
@media (max-width:480px){#projbar{gap:6px;padding-left:10px;padding-right:10px}#projbar select{min-width:80px}#projbar .btn{padding:7px 6px}}
.thumbs{display:flex;gap:8px;align-items:center;margin-top:6px}.thumbs img,.th img{height:84px;border-radius:6px;border:1.5px solid var(--line);animation:popIn .25s var(--ease)}
.th{display:flex;gap:6px;margin:6px 0}
#mapSec,#list{animation:secIn .28s var(--ease)}
@keyframes secIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<header><h1 id="title">COTELCO: Transformer Load Management</h1><span id="net" role="status" aria-label="Offline" title="Offline"></span><button id="thm" type="button">Light</button></header>
<nav role="tablist">
  <button role="tab" aria-selected="true" data-t="map">Map</button>
  <button role="tab" aria-selected="false" data-t="list" id="tabList">Saved (0)</button>
</nav>
<div id="projbar"><label for="projSel">Project</label><select id="projSel"></select><button class="btn" id="pNew">New</button><button class="btn" id="pRen">Rename</button><button class="btn d" id="pDel">Delete</button></div>
<main>
<section id="sheet" hidden><div class="bar"><b id="sheetT">New pole</b><button type="button" class="btn" id="sx">Cancel</button></div><div style="max-width:720px;margin:0 auto;padding:14px">
<form id="f" autocomplete="off">
<fieldset><legend>Pole</legend>
<div class="grid">
  <div><label for="pno">Pole #</label><input type="text" id="pno"></div>
  <div><label for="vp">Voltage at pole</label><div class="unit"><input type="number" id="vp" inputmode="decimal" step="any"><b>V</b></div></div>
  <div id="vcalc" class="calc full"></div><div class="full"><label for="pri">Primary line structure (main / lateral / count)</label><div class="grid3"><select id="pri"></select><select id="pril" aria-label="Primary lateral"></select><select id="priq" aria-label="Number of laterals"></select></div></div>
  <div class="full"><label for="sec">Secondary line structure * (main / lateral)</label><div class="grid3"><select id="sec"></select><select id="secl" aria-label="Secondary lateral"></select></div></div>
  <div class="full"><label>Material *</label>
    <div class="seg" id="mat"><label><input type="radio" name="mat" value="Wood"><span>Wood</span></label><label><input type="radio" name="mat" value="Cement"><span>Cement</span></label><label><input type="radio" name="mat" value="Steel"><span>Steel</span></label></div></div>
  <div class="full"><button type="button" class="btn" id="phP">Take pole photo</button><div id="thP" class="thumbs"></div></div>
  <div class="full"><label for="prem">Pole remarks</label><textarea id="prem"></textarea></div>
</div>
<datalist id="priL"></datalist><datalist id="secL"></datalist><datalist id="projL"></datalist>
</fieldset>

<fieldset><legend>Transformer</legend>
<div class="seg" style="margin-bottom:10px"><label><input type="checkbox" id="hasTx"><span>This pole has a transformer</span></label></div>
<div id="txBox" hidden>
<div class="grid">
  <div><label for="kva">Rating *</label><div class="unit"><select id="kva"></select><b>kVA</b></div></div>
  <div><label for="tap">Tap position</label><select id="tap"></select></div>
  <div class="full"><label>Type *</label>
    <div class="seg"><label><input type="radio" name="ttype" value="CSP"><span>CSP</span></label><label><input type="radio" name="ttype" value="Conventional"><span>Conventional</span></label></div></div>
  <div class="full"><label>Accessories present</label>
    <div class="seg"><label><input type="checkbox" id="acut"><span>Cutout</span></label><label><input type="checkbox" id="ahan"><span>Hanger</span></label><label><input type="checkbox" id="agnd"><span>Grounding</span></label></div></div>
  <div class="full"><label>Secondary line current</label></div>
  <div><label for="i1">Line *</label><div class="unit"><input type="number" id="i1" inputmode="decimal" step="any"><b>A</b></div></div>
  <div><label for="in">Neutral (optional)</label><div class="unit"><input type="number" id="in" inputmode="decimal" step="any"><b>A</b></div></div>
  <div class="full"><button type="button" class="btn" id="phT">Take transformer photo</button><div id="thT" class="thumbs"></div></div>
  <div id="calc" class="calc full"></div><div class="full"><label for="trem">Transformer remarks</label><textarea id="trem"></textarea></div>
</div>
</div>
</fieldset>

<fieldset><legend>Line to previous pole</legend><div class="grid">
  <div class="full"><label for="conn">Connected to</label><select id="conn"></select></div>
  <div class="full"><label for="lc">Current on this line</label><div class="unit"><input type="number" id="lc" inputmode="decimal" step="any"><b>A</b></div></div></div></fieldset>

<fieldset><legend>Location (where you tapped)</legend>
  
  <div id="gps"></div>
</fieldset>

<input type="file" id="phF" accept="image/*" capture="environment" hidden>
<div class="row"><button type="submit" class="btn p" id="saveBtn">Save record</button><button type="button" class="btn" id="clr">Cancel</button></div>
</form></div>
</section>

<section id="mapSec">
  <div id="map"><canvas id="cv"></canvas><div id="mnote"></div><div id="gstat" hidden><span id="gmsg"></span><button type="button" class="btn" id="greq">Enable location</button></div><select id="baseSel" aria-label="Base map"></select>
    <div class="mb"><button id="zi">+</button><button id="zo">-</button><button id="fit">All</button><button id="loc">Me</button></div>
    <div id="pop" hidden></div></div>
</section>

<section id="list" hidden>
  <div class="row" style="margin-bottom:12px">
    <button class="btn" id="xCsv">Export CSV</button><button class="btn" id="xGeo">Export GeoJSON</button>
    <button class="btn" id="xJson">Backup JSON</button><button class="btn" id="imp">Import backup</button>
    <input type="file" id="file" accept=".json,application/json" hidden>
  </div>
  <div id="recs"></div>
  
</section>
</main>
<div id="toast" role="status"></div>

<script>
(function(){
var KEY='poleSurvey.v1', recs=[], editId=null, pos=null, lastProj='', projects=[];
var $=function(i){return document.getElementById(i)};
function load(){try{recs=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){recs=[];toast('Could not read saved data')}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(recs));localStorage.setItem(KEY+'.projects',JSON.stringify(projects));return true}catch(e){toast('Save failed: storage full or blocked. Export now!');return false}}
function toast(m){var t=$('toast');t.textContent=m;t.className='show';clearTimeout(toast.h);toast.h=setTimeout(function(){t.className=''},2600)}
function radio(n){var r=document.querySelector('input[name='+n+']:checked');return r?r.value:''}
function setRadio(n,v){document.querySelectorAll('input[name='+n+']').forEach(function(r){r.checked=(r.value===v)})}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

// tabs
document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){
  document.querySelectorAll('nav button').forEach(function(x){x.setAttribute('aria-selected',x===b)});
  $('list').hidden=b.dataset.t!=='list';$('mapSec').hidden=b.dataset.t!=='map';if(b.dataset.t==='list')render();if(b.dataset.t==='map')mapOpen();else mapClose()}});
function net(){var n=$('net'),on=navigator.onLine,t=on?'Online':'Offline';n.classList.toggle('on',on);n.title=t;n.setAttribute('aria-label',t)}
addEventListener('online',net);addEventListener('offline',net);net();
$('hasTx').onchange=function(){$('txBox').hidden=!this.checked};

function showPos(){$('gps').textContent=pos?pos.lat.toFixed(6)+', '+pos.lon.toFixed(6)+(pos.src==='map'?' (picked on map)':' (±'+pos.acc+' m)'):'No position yet. Works offline; needs a clear sky.'}

// form
function num(id){var v=$(id).value;return v===''?'':Number(v)}
function collect(){
  var tx=$('hasTx').checked;
  return {id:editId||('r'+Date.now()),time:new Date().toISOString(),pos:pos,project:(editId&&(recs.find(function(x){return x.id===editId})||{}).project)||lastProj,from:$('conn').value,
    pole:{no:$('pno').value.trim(),primary:priStr(),secondary:secStr(),p:{m:$('pri').value,l:$('pril').value,q:parseInt($('priq').value)||1},s:{m:$('sec').value,l:$('secl').value},material:radio('mat'),voltage:num('vp'),lineA:num('lc'),remarks:$('prem').value.trim()},
    tx:tx?{rating:$('kva').value,type:radio('ttype'),tap:$('tap').value,cutout:$('acut').checked,hanger:$('ahan').checked,grounding:$('agnd').checked,line:num('i1'),neutral:num('in'),remarks:$('trem').value.trim()}:null};
}
function fill(r){
  $('pno').value=r.pole.no;var pp=r.pole.p||{m:r.pole.primary,l:'',q:1},ss=r.pole.s||{m:r.pole.secondary,l:''};$('pri').value=pp.m||'';$('pril').value=pp.l||'';$('priq').value=pp.q>1?pp.q+' laterals':'';$('sec').value=ss.m||'';$('secl').value=ss.l||'';setRadio('mat',r.pole.material);$('vp').value=r.pole.voltage;$('lc').value=r.pole.lineA==null?'':r.pole.lineA;$('conn').value=r.from||'';$('prem').value=r.pole.remarks;
  var t=r.tx;$('hasTx').checked=!!t;$('txBox').hidden=!t;t=t||{};
  $('kva').value=t.rating==null?'':t.rating;setRadio('ttype',t.type||'');$('tap').value=t.tap||'';
  $('acut').checked=!!t.cutout;$('ahan').checked=!!t.hanger;$('agnd').checked=!!t.grounding;
  var ln=t.line==null?t.i1:t.line;$('i1').value=ln==null?'':ln;$('in').value=t.neutral==null?'':t.neutral;$('trem').value=t.remarks||'';
  pos=r.pos||null;showPos();
}
function reset(){$('f').reset();$('txBox').hidden=true;pos=null;editId=null;showPos();$('saveBtn').textContent='Save record'}
$('clr').onclick=cancelSheet;
$('f').onsubmit=function(e){
  e.preventDefault();var r=collect();var o0=recs.find(function(x){return x.id===r.id})||{pole:{}};r.pole.ph=phD.P?!!ph.P:!!o0.pole.ph;if(r.tx)r.tx.ph=phD.T?!!ph.T:!!(o0.tx&&o0.tx.ph);var miss=[];if(!r.pole.s.m)miss.push('Secondary structure');if(!r.pole.material)miss.push('Material');if(r.tx){if(r.tx.rating==='')miss.push('Transformer rating');if(!r.tx.type)miss.push('Transformer type');if(r.tx.line===''||r.tx.line==null)miss.push('Line current')}if(miss.length){toast('Required: '+miss.join(', '));return}if(!pos){toast('No location: tap the map to place the pole');return}if(r.pole.no&&recs.some(function(x){return x.id!==r.id&&x.project===r.project&&String(x.pole.no).toLowerCase()===r.pole.no.toLowerCase()})&&!confirm('Pole '+r.pole.no+' already exists in this project. Save anyway?'))return;if(r.tx){var n=recs.filter(function(x){return x.tx&&x.project===r.project&&x.id!==r.id}).length;if(n>=5&&!confirm('This project already has '+n+' transformers (max 5). Save anyway?'))return}
  var i=recs.findIndex(function(x){return x.id===r.id});
  if(i>=0)recs[i]=r;else recs.unshift(r);
  if(persist()){toast('Saved pole '+r.pole.no);savePh(r,o0);reset();closeSheet();lists();count();M.pend=null;M.sel=null;draw()}
};
function lists(){var pj={};recs.forEach(function(r){if(r.project)pj[r.project]=1});$('projL').innerHTML=Object.keys(pj).map(function(v){return '<option value="'+esc(v)+'">'}).join('');
  ['pri','sec'].forEach(function(k){
    var seen={};recs.forEach(function(r){var v=r.pole[k==='pri'?'primary':'secondary'];if(v)seen[v]=1});
    $(k+'L').innerHTML=Object.keys(seen).map(function(v){return '<option value="'+esc(v)+'">'}).join('')})}
function count(){$('tabList').textContent='Saved ('+vis().length+')'}

// list

    M.zt=clampZ(pinch.z0+Math.log2(Math.max(d,.001)/pinch.d0));projPeek();zoomRun()}
  draw()};
cv.onpointerup=cv.onpointercancel=function(e){if(P[e.pointerId]&&Object.keys(P).length===1&&mv<8)tap(e);
  delete P[e.pointerId];if(Object.keys(P).length<2){pinch=null;M.anchor=null}};
cv.onwheel=function(e){e.preventDefault();var b=cv.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top,A=atLL(x,y);
  var base=M.zt==null?M.z:M.zt,d=-e.deltaY*(e.deltaMode===1?0.25:0.004);d=Math.max(-1,Math.min(1,d));
  var z=clampZ(base+d);if(Math.abs(z-base)<0.0001)return;
  M.anchor={lat:A.lat,lon:A.lon,x:e.clientX,y:e.clientY};M.zt=z;projPeek();zoomRun()};
function tap(e){var b=cv.getBoundingClientRect(),x=e.clientX-b.left,y=e.clientY-b.top,best=null,bd=26;
  M.hits.forEach(function(h){var d=Math.hypot(h.x-x,h.y-y);if(d<bd){bd=d;best=h.id}});
  M.sel=best;M.pend=null;$('pop').hidden=true;
  if(!best){var c0=ll(M.cx-b.width/2+x,M.cy-b.height/2+y,M.z);M.pend={lat:c0.lat,lon:c0.lon};$('pop').hidden=false;$('pop').innerHTML='<b>New pole here</b><br>'+c0.lat.toFixed(6)+', '+c0.lon.toFixed(6)+'<div class="row" style="margin-top:8px"><button class="btn p" id="pn">Save as pole</button><button class="btn" id="pc">Cancel</button></div>';$('pn').onclick=function(){openSheet()};$('pc').onclick=function(){M.pend=null;$('pop').hidden=true;draw()}}
  if(best){var r=recs.find(function(q){return q.id===best}),t=r.tx,p=r.pole;
    $('pop').hidden=false;$('pop').innerHTML='<b>Pole '+esc(p.no)+'</b> ('+esc(r.project||'')+')<br>'+esc(p.primary||'-')+' / '+esc(p.secondary||'-')+(p.voltage!==''?', '+p.voltage+' V':'')
      +(t?'<br>'+esc(t.rating)+' kVA '+esc(t.type)+', tap '+esc(t.tap)+', line '+(t.line===''||t.line==null?'-':t.line)+' A':'')
      +loadHtml(r)+'<div class="row" style="margin-top:8px"><button class="btn" id="pe">Edit</button><button class="btn" id="pc">Close</button></div>';
    $('pe').onclick=function(){openSheet(r)};
    $('pc').onclick=function(){$('pop').hidden=true;M.sel=null;draw()}}
  draw()}
$('zi').onclick=function(){zoom(1)};$('zo').onclick=function(){zoom(-1)};$('fit').onclick=fit;
$('loc').onclick=gpsAsk;$('greq').onclick=gpsAsk;
addEventListener('resize',draw);
if(window.ResizeObserver){var ro=new ResizeObserver(function(){if(ro.p)return;ro.p=requestAnimationFrame(function(){ro.p=0;draw()})});ro.observe($('map'))}
Object.keys(BASES).forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=BASES[k].n;$('baseSel').appendChild(o)});
try{var th0=localStorage.getItem(KEY+'.theme');if(th0)document.documentElement.dataset.theme=th0}catch(e){}
try{M.base=localStorage.getItem(KEY+'.base')||(isDark()?'dkg':'st');M.cust=localStorage.getItem(KEY+'.cust')||''}catch(e){}
if(!BASES[M.base])M.base='dkg';$('baseSel').value=M.base;
$('baseSel').onchange=function(){var v=this.value;
  if(v==='cus'){var u=prompt('Tile URL with {z} {x} {y}:',M.cust||'');if(!u){this.value=M.base;return}M.cust=u;try{localStorage.setItem(KEY+'.cust',u)}catch(e){}}
  M.base=v;M.t={};M.err=0;try{localStorage.setItem(KEY+'.base',v)}catch(e){}draw()};

// calculations (230 V nominal, single phase)
var VN=230;
function calc(kva,amps,v){var o={};
  if(kva!==''&&kva!=null&&amps!==''&&amps!=null&&+kva>0){o.kva=VN*amps/1000;o.pct=o.kva/kva*100}
  if(v!==''&&v!=null)o.dev=(v-VN)/VN*100;return o}
function cc(r){var t=r.tx;return calc(t?t.rating:'',t&&t.line!=null?t.line:'',r.pole.voltage)}
function cv(r,k){var v=cc(r)[k];return v==null?'':v.toFixed(2)}
function sg(d){return(d>=0?'+':'')+d.toFixed(1)+'%'}
function loadHtml(r){var c=cc(r),a=[];
  if(c.kva!=null)a.push('Load '+c.kva.toFixed(2)+' kVA, '+c.pct.toFixed(1)+'% of rating'+(c.pct>100?' (overloaded)':''));
  if(c.dev!=null)a.push('Voltage '+sg(c.dev)+' vs '+VN+' V');
  if(r.pole.lineA!==''&&r.pole.lineA!=null)a.push('Line current '+r.pole.lineA+' A');
  return a.length?'<p>'+a.join(' | ')+'</p>':''}
function liveCalc(){var i=$('i1').value,v=$('vp').value,c=calc($('kva').value,i===''?'':+i,v===''?'':+v);
  $('vcalc').textContent=c.dev==null?'':'Voltage '+sg(c.dev)+' vs '+VN+' V nominal';
  $('calc').innerHTML=c.kva==null?'':'Load '+c.kva.toFixed(2)+' kVA ('+VN+' V x '+i+' A) = <span class="'+(c.pct>100?'bad':'')+'">'+c.pct.toFixed(1)+'%</span> of '+$('kva').value+' kVA'+(c.pct>100?' - overloaded':'')}
['kva','i1','vp'].forEach(function(id){$(id).addEventListener('input',liveCalc);$(id).addEventListener('change',liveCalc)});

// entry sheet
function closeSheet(){$('sheet').hidden=true;document.body.style.overflow=''}
function cancelSheet(){reset();closeSheet();M.pend=null;draw()}
function openSheet(r){reset();ph={P:null,T:null};phD={P:0,T:0};buildConn(r?r.id:'');
  if(r){editId=r.id;fill(r);['P','T'].forEach(function(w){pget(r.id+':'+w).then(function(v){if(v&&!phD[w]){ph[w]=v;showPh()}})});$('saveBtn').textContent='Update record';$('sheetT').textContent='Edit pole '+r.pole.no}
  else{$('conn').value=(vis().filter(function(x){return x.pos})[0]||{}).id||'';$('sheetT').textContent='New pole';if(M.pend){pos={lat:M.pend.lat,lon:M.pend.lon,acc:0,src:'map'};showPos()}}
  $('pop').hidden=true;liveCalc();syncLat();showPh();$('sheet').hidden=false;$('sheet').scrollTop=0;document.body.style.overflow='hidden';
  if(!r)setTimeout(function(){$('pno').focus()},60)}
$('sx').onclick=cancelSheet;
// projects
function vis(){return recs.filter(function(r){return r.project===lastProj})}
function projNames(){var o={};projects.forEach(function(n){o[n]=1});recs.forEach(function(r){if(r.project)o[r.project]=1});return Object.keys(o)}
function projUI(){var n=projNames();if(!n.length)n=['Project 1'];if(n.indexOf(lastProj)<0)lastProj=n[0];projects=n;
  $('projSel').innerHTML=n.map(function(v){return '<option>'+esc(v)+'</option>'}).join('');$('projSel').value=lastProj;
  try{localStorage.setItem(KEY+'.proj',lastProj)}catch(e){}persist()}
function switchProj(){M.sel=null;M.pend=null;$('pop').hidden=true;count();render();fit()}
$('projSel').onchange=function(){lastProj=this.value;projUI();switchProj()};
$('pNew').onclick=function(){var n=(prompt('New project name:')||'').trim();if(!n)return;if(projNames().indexOf(n)<0)projects.push(n);lastProj=n;projUI();switchProj()};
$('pRen').onclick=function(){var n=(prompt('Rename project:',lastProj)||'').trim();if(!n||n===lastProj)return;if(projNames().indexOf(n)>=0)return toast('That name already exists');
  recs.forEach(function(r){if(r.project===lastProj)r.project=n});projects=projects.filter(function(p){return p!==lastProj});projects.push(n);lastProj=n;projUI();render()};
$('pDel').onclick=function(){var k=vis();if(!confirm('Delete project "'+lastProj+'" and its '+k.length+' pole(s)? Export a backup first.'))return;
  k.forEach(function(r){pput(r.id+':P',null);pput(r.id+':T',null)});recs=recs.filter(function(r){return r.project!==lastProj});projects=projects.filter(function(p){return p!==lastProj});lastProj='';projUI();switchProj()};
function buildConn(self){var a=vis().filter(function(x){return x.pos&&x.id!==self});
  $('conn').innerHTML='<option value="">None (start of a line)</option>'+a.map(function(x){return '<option value="'+x.id+'">'+esc((x.pole.no?'Pole # '+x.pole.no:'Unnumbered')+(x.pole.primary?' - '+x.pole.primary:''))+'</option>'}).join('')}
// photos (stored in IndexedDB so they do not fill localStorage)
var ph={P:null,T:null},phD={P:0,T:0},phW='P',db=null;
function idb(){return new Promise(function(res,rej){if(db)return res(db);var q=indexedDB.open('poleSurveyPhotos',1);q.onupgradeneeded=function(){q.result.createObjectStore('p')};q.onsuccess=function(){db=q.result;res(db)};q.onerror=function(){rej(q.error)}})}
function pget(k){return idb().then(function(d){return new Promise(function(res){var r=d.transaction('p').objectStore('p').get(k);r.onsuccess=function(){res(r.result||null)};r.onerror=function(){res(null)}})}).catch(function(){return null})}
function pput(k,v){return idb().then(function(d){return new Promise(function(res){var t=d.transaction('p','readwrite'),o=t.objectStore('p');if(v)o.put(v,k);else o.delete(k);t.oncomplete=function(){res(1)};t.onerror=function(){res(0)}})}).catch(function(){toast('Photo storage unavailable');return 0})}
function pall(){return idb().then(function(d){return new Promise(function(res){var o={},c=d.transaction('p').objectStore('p').openCursor();c.onsuccess=function(){var x=c.result;if(x){o[x.key]=x.value;x.continue()}else res(o)};c.onerror=function(){res(o)}})}).catch(function(){return{}})}
function shrink(file){return new Promise(function(res){var im=new Image(),u=URL.createObjectURL(file);im.onload=function(){var k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.72))};im.onerror=function(){res(null)};im.src=u})}
function showPh(){['P','T'].forEach(function(w){$('th'+w).innerHTML=ph[w]?'<img src="'+ph[w]+'" alt="photo"><button type="button" class="btn d" data-w="'+w+'">Remove</button>':''})}
function savePh(r,o0){['P','T'].forEach(function(w){if(phD[w])pput(r.id+':'+w,(w==='T'&&!r.tx)?null:ph[w])});if(!r.tx&&o0.tx&&o0.tx.ph)pput(r.id+':T',null)}
function loadThumbs(){document.querySelectorAll('#recs .th').forEach(function(el){['P','T'].forEach(function(w){pget(el.dataset.i+':'+w).then(function(v){if(v){var i=new Image();i.src=v;i.alt=w==='P'?'Pole photo':'Transformer photo';el.appendChild(i)}})})})}
$('phP').onclick=function(){phW='P';$('phF').click()};$('phT').onclick=function(){phW='T';$('phF').click()};
$('phF').onchange=function(){var f=this.files[0],w=phW;this.value='';if(!f)return;shrink(f).then(function(d){if(!d)return toast('Could not read photo');ph[w]=d;phD[w]=1;showPh()})};
$('thP').onclick=$('thT').onclick=function(e){var b=e.target.closest('button');if(b){ph[b.dataset.w]=null;phD[b.dataset.w]=1;showPh()}};
function pn(id){var x=recs.find(function(y){return y.id===id});return x?x.pole.no:''}
function priStr(){var q=parseInt($('priq').value)||1,l=$('pril').value;return[$('pri').value,l?(q>1?q+'-':'')+l:''].filter(Boolean).join(' / ')}
function secStr(){return[$('sec').value,$('secl').value].filter(Boolean).join(' / ')}
function syncLat(){var on=!!$('pril').value;$('priq').disabled=!on;if(!on)$('priq').value=''}
function pinLabel(r){var t=[r.tx&&r.tx.rating?r.tx.rating+' kVA':'',r.pole.no?'Pole # '+r.pole.no:'',r.pole.material,[r.pole.primary,r.pole.secondary].filter(Boolean).join(' / ')].filter(Boolean).join(', ');return t+(r.pole.voltage!==''&&r.pole.voltage!=null?'; '+r.pole.voltage+' V':'')}
function isDark(){return document.documentElement.dataset.theme!=='light'}
$('thm').textContent=isDark()?'Light':'Dark';
$('thm').onclick=function(){var l=isDark();document.documentElement.dataset.theme=l?'light':'dark';try{localStorage.setItem(KEY+'.theme',l?'light':'dark')}catch(e){}$('thm').textContent=l?'Dark':'Light';draw()};

load();recs.forEach(function(r){if(!r.project)r.project=lastProj||'Project 1'});projUI();lists();count();mapOpen();
})();
